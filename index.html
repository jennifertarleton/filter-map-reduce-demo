<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>filter, map, reduce</title>
  <!-- Week 6 Day 4 demo. Step through with Next / Back or the arrow keys. Jump to a screen with #N in the URL. -->
  <!-- 5 PRETEND characters with small numbers so the math is easy (total 15, average 3). Not real API data. -->
  <style>
    :root {
      --bg: #fffcf9;
      --ink: #1e293b;
      --muted: #64748b;
      --blue: #4e89bd;
      --red: #e06c75;
      --green: #3f8f5a;
      --gold: #d79b2b;
      --line: #e2dcd3;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    h1 { margin: 24px 24px 0; font-size: 1.6rem; text-align: center; }
    h1 .tool { color: var(--blue); font-family: Consolas, monospace; }

    .stage {
      flex: 1;
      max-width: 1150px;
      width: 100%;
      margin: 0 auto;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 24px;
      align-items: center;
    }

    .code {
      border: 3px solid var(--blue);
      border-radius: 14px;
      background: white;
      padding: 14px 0;
      font-family: Consolas, monospace;
      font-size: 1.05rem;
    }

    .line {
      padding: 3px 18px;
      white-space: pre;
      border-left: 6px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .line.on { background: #fff1cc; border-left-color: var(--gold); }

    .right { display: flex; flex-direction: column; gap: 18px; }

    .row-label { color: var(--muted); font-weight: 700; font-family: Consolas, monospace; margin-bottom: 6px; }

    .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }

    .item {
      border: 3px solid var(--ink);
      border-radius: 12px;
      background: white;
      padding: 8px 4px;
      text-align: center;
      transition: border-color 0.3s, box-shadow 0.3s, opacity 0.3s, background 0.3s;
    }

    .item .emoji { font-size: 1.9rem; }
    .item .name { font-weight: 700; }
    .item .small { font-size: 0.85rem; color: var(--muted); }
    .item .status.dead { color: var(--red); font-weight: 700; }
    .item .num { font-family: Consolas, monospace; font-size: 2rem; font-weight: 700; }

    .item.current { border-color: var(--gold); box-shadow: 0 0 0 6px #fde9b8; }
    .item.keep { border-color: var(--green); background: #e7f4ea; }
    .item.out { opacity: 0.3; }

    .result {
      border: 3px dashed var(--line);
      border-radius: 12px;
      background: white;
      padding: 12px 16px;
      min-height: 96px;
      text-align: center;
    }

    .result .k { color: var(--muted); font-weight: 700; font-family: Consolas, monospace; }
    .result .v { font-family: Consolas, monospace; font-size: 1.7rem; font-weight: 700; color: var(--green); min-height: 1.3em; }
    .result .math { color: var(--muted); font-family: Consolas, monospace; min-height: 1.4em; }

    .caption {
      max-width: 950px;
      margin: 0 auto 8px;
      padding: 0 24px;
      min-height: 4.5em;
      font-size: 1.45rem;
      text-align: center;
    }

    code { font-family: Consolas, monospace; background: #f1ede7; padding: 1px 6px; border-radius: 4px; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 24px 24px; }

    .controls button {
      padding: 10px 24px;
      font: inherit;
      font-weight: 700;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: white;
      cursor: pointer;
    }

    .controls #next { background: var(--ink); color: white; }
    .controls button:disabled { opacity: 0.35; cursor: default; }
    .count { color: var(--muted); }

    @media (max-width: 860px) {
      .stage { grid-template-columns: 1fr; }
      .code { font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <h1 id="title">Three array tools</h1>

  <div class="stage">
    <div class="code" id="code"></div>

    <div class="right">
      <div>
        <div class="row-label" id="row-label"></div>
        <div class="row" id="row"></div>
      </div>
      <div class="result">
        <div class="k" id="r-label"></div>
        <div class="v" id="r-value"></div>
        <div class="math" id="r-math"></div>
      </div>
    </div>
  </div>

  <p class="caption" id="caption"></p>

  <div class="controls">
    <button id="back" type="button">← Back</button>
    <span class="count" id="count"></span>
    <button id="next" type="button">Next →</button>
  </div>

  <script>
    // 5 pretend characters. episodes = character.episode.length in the real API.
    const characters = [
      { emoji: "👽", name: "Zorp", species: "Alien", status: "Alive", episodes: 3 },
      { emoji: "🧑", name: "Ana",  species: "Human", status: "Dead",  episodes: 5 },
      { emoji: "🤖", name: "Bolt", species: "Robot", status: "Alive", episodes: 2 },
      { emoji: "🧑", name: "Cy",   species: "Human", status: "Dead",  episodes: 4 },
      { emoji: "👽", name: "Glim", species: "Alien", status: "Alive", episodes: 1 }
    ];

    const filterCode = [
      "const dead = characters.filter(function (character) {",
      "  return character.status === \"Dead\";",
      "});",
      "",
      "addSummary(\"Dead\", dead.length);"
    ];
    const mapCode = [
      "const episodeCounts = characters.map(function (character) {",
      "  return character.episode.length;",
      "});"
    ];
    const reduceCode = [
      "const totalEpisodes = episodeCounts.reduce(function (total, number) {",
      "  return total + number;",
      "}, 0);",
      "",
      "Math.round(totalEpisodes / episodeCounts.length)"
    ];

    const steps = [];

    // ---------- Intro ----------
    steps.push({ title: "Three array tools", code: ["filter → KEEP some", "map    → CHANGE every one", "reduce → SQUISH into one value"], mode: "cards",
      text: "Three tools for arrays. Each one <strong>walks the list</strong>, one item at a time, like <code>forEach</code>. What's different is what you get <strong>back</strong>." });

    // ---------- filter ----------
    steps.push({ tool: "filter", code: filterCode, line: 0, mode: "cards", marks: [], rLabel: "dead", rValue: "[ ]",
      text: "<code>filter</code> asks every character a <strong>yes or no</strong> question. Yes (<code>true</code>) = keep it. No (<code>false</code>) = leave it out." });
    const kept = [];
    characters.forEach(function (c, n) {
      const yes = c.status === "Dead";
      if (yes) kept.push(c.name);
      const marks = characters.map(function (x, m) {
        if (m > n) return null;
        return x.status === "Dead" ? "keep" : "out";
      });
      steps.push({ tool: "filter", code: filterCode, line: 1, mode: "cards", at: n, marks: marks,
        rLabel: "dead", rValue: "[ " + kept.join(", ") + " ]",
        rMath: "\"" + c.status + "\" === \"Dead\" → " + (yes ? "true ✔" : "false ✖"),
        text: c.name + "'s status is <code>\"" + c.status + "\"</code>. " +
          (yes ? "That's <strong>true</strong>, so " + c.name + " is <strong>kept</strong>." : "That's <strong>false</strong>, so " + c.name + " is left out.") });
    });
    const allMarks = characters.map(function (c) { return c.status === "Dead" ? "keep" : "out"; });
    steps.push({ tool: "filter", code: filterCode, line: 4, mode: "cards", marks: allMarks,
      rLabel: "dead.length", rValue: "2", rMath: "[ Ana, Cy ] has 2 items",
      text: "<code>filter</code> gives back a <strong>new, shorter array</strong>: just the 2 kept. The 5 are still there. <code>dead.length</code> is 2, so the card says <strong>2</strong>." });

    // ---------- map ----------
    steps.push({ tool: "map", code: mapCode, line: 0, mode: "cards", rLabel: "episodeCounts", rValue: "[ ]",
      text: "<code>map</code> <strong>changes every one</strong>. Whatever you <code>return</code> goes into a new array. Here: turn each character into <strong>how many episodes</strong> they're in." });
    const nums = [];
    characters.forEach(function (c, n) {
      nums.push(c.episodes);
      steps.push({ tool: "map", code: mapCode, line: 1, mode: "cards", at: n, done: n,
        rLabel: "episodeCounts", rValue: "[ " + nums.join(", ") + " ]", rMath: c.name + " → " + c.episodes,
        text: c.name + " is in " + c.episodes + " episode" + (c.episodes === 1 ? "" : "s") + ". Return <code>" + c.episodes + "</code>, and it goes in the new array." });
    });
    steps.push({ tool: "map", code: mapCode, line: 2, mode: "numbers", rLabel: "episodeCounts", rValue: "[ 3, 5, 2, 4, 1 ]", rMath: "5 characters in → 5 numbers out",
      text: "<code>map</code> gives back the <strong>same number of items</strong>: 5 in, 5 out. But now they're just <strong>numbers</strong>. That's what Step 4 needs." });

    // ---------- reduce ----------
    steps.push({ tool: "reduce", code: reduceCode, line: 2, mode: "numbers", rLabel: "total", rValue: "0", rMath: "starts at the 0 at the end",
      text: "<code>reduce</code> <strong>squishes</strong> the list into one value. <code>total</code> starts at the <strong>0</strong> at the end. Now walk the numbers." });
    let total = 0;
    nums.forEach(function (x, n) {
      const before = total;
      total = total + x;
      steps.push({ tool: "reduce", code: reduceCode, line: 1, mode: "numbers", at: n, done: n - 1,
        rLabel: "total", rValue: String(total), rMath: before + " + " + x + " = " + total,
        text: "<code>number</code> is <strong>" + x + "</strong>. Return <code>total + number</code>: " + before + " + " + x + " = <strong>" + total + "</strong>. That becomes the new <code>total</code>." +
          (n === 0 ? " Each item is already a number, so it's just <code>+ number</code>." : "") });
    });
    steps.push({ tool: "reduce", code: reduceCode, line: 0, mode: "numbers", done: 4, rLabel: "totalEpisodes", rValue: "15", rMath: "5 numbers in → 1 number out",
      text: "Done: <strong>one</strong> number, 15. That's <code>totalEpisodes</code>. (In class it's 242.)" });
    steps.push({ tool: "reduce", code: reduceCode, line: 4, mode: "numbers", done: 4, rLabel: "average", rValue: "3", rMath: "15 ÷ 5 = 3",
      text: "The average: total ÷ how many. <code>15 / episodeCounts.length</code> = 15 ÷ 5 = <strong>3</strong>. <code>Math.round</code> cleans up any decimals. (In class it's 12.)" });

    // ---------- Wrap ----------
    steps.push({ title: "Three array tools", code: ["filter → fewer items     5 → 2", "map    → same count      5 → 5 numbers", "reduce → one value       5 → 15"], mode: "numbers",
      rLabel: "", rValue: "", text: "<strong>Which tool?</strong> Want some of them? <code>filter</code>. Want every one changed? <code>map</code>. Want one answer, like a total? <code>reduce</code>." });

    function el(id) { return document.getElementById(id); }

    let step = 0;

    function show() {
      const s = steps[step];

      el("title").innerHTML = s.tool ? '<span class="tool">' + s.tool + "</span>" : s.title;

      el("code").innerHTML = "";
      s.code.forEach(function (text, n) {
        const line = document.createElement("div");
        line.className = "line" + (n === s.line ? " on" : "");
        line.textContent = text || " ";
        el("code").appendChild(line);
      });

      el("row-label").textContent = s.mode === "numbers" ? "episodeCounts" : "characters";
      el("row").innerHTML = "";
      characters.forEach(function (c, n) {
        const item = document.createElement("div");
        item.className = "item";
        if (s.mode === "numbers") {
          item.innerHTML = '<div class="num">' + c.episodes + '</div><div class="small">' + c.name + "</div>";
        } else {
          item.innerHTML = '<div class="emoji">' + c.emoji + '</div><div class="name">' + c.name +
            '</div><div class="small status' + (c.status === "Dead" ? " dead" : "") + '">' + c.status +
            '</div><div class="small">episodes: ' + c.episodes + "</div>";
        }
        if (s.at === n) item.classList.add("current");
        if (s.marks && s.marks[n] === "keep") item.classList.add("keep");
        if (s.marks && s.marks[n] === "out" && s.at !== n) item.classList.add("out");
        if (s.done !== undefined && n <= s.done && s.at !== n) item.classList.add("out");
        el("row").appendChild(item);
      });

      el("r-label").textContent = s.rLabel || "";
      el("r-value").textContent = s.rValue || "";
      el("r-math").textContent = s.rMath || "";

      el("caption").innerHTML = s.text;
      el("count").textContent = (step + 1) + " / " + steps.length;
      el("back").disabled = step === 0;
      el("next").disabled = step === steps.length - 1;
      history.replaceState(null, "", "#" + (step + 1));
    }

    function jump() {
      const n = parseInt(location.hash.slice(1), 10);
      if (n >= 1 && n <= steps.length && n - 1 !== step) { step = n - 1; show(); }
    }

    el("next").addEventListener("click", function () { if (step < steps.length - 1) { step++; show(); } });
    el("back").addEventListener("click", function () { if (step > 0) { step--; show(); } });
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight") el("next").click();
      if (e.key === "ArrowLeft") el("back").click();
    });
    window.addEventListener("hashchange", jump);

    const start = parseInt(location.hash.slice(1), 10);
    if (start >= 1 && start <= steps.length) step = start - 1;
    show();
  </script>
</body>
</html>
